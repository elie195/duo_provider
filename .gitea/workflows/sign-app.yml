name: Sign app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  OC_VERSION: "10.16.1"

jobs:
  sign:
    runs-on: ubuntu-latest  # plain runner, no container:

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy app to staging dir and strip .git
        run: |
          STAGING=$(realpath "$GITHUB_WORKSPACE/../staging")
          cp -r "$GITHUB_WORKSPACE/." "$STAGING"
          rm -rf "$STAGING/.git"
          rm -rf "$STAGING/.gitea"
          echo "STAGING=$STAGING" >> $GITHUB_ENV
      
      - name: Debug staging
        run: |
          echo "STAGING=$STAGING"
          ls -la "$STAGING"
          ls -la "$STAGING/appinfo"
          docker run --rm \
            -v "$STAGING":/app-staging \
            owncloud/server:$OC_VERSION \
            ls -la /app-staging

      - name: Sign and package
        run: |
          docker run -d --name oc-signer \
            -e PRIVATE_KEY="${{ secrets.OC_PRIVATE_KEY }}" \
            -e CERTIFICATE="${{ secrets.OC_CERTIFICATE }}" \
            --entrypoint sleep \
            owncloud/server:$OC_VERSION 300

          docker exec oc-signer mkdir -p /app-staging/duo
          docker cp "$STAGING/." oc-signer:/app-staging/duo

          # Delete any existing signature before signing
          docker exec oc-signer rm -f /app-staging/duo/appinfo/signature.json

          docker exec oc-signer /bin/bash -c "
            mkdir -p /tmp/oc-certs && \
            printf '%s' \"\$PRIVATE_KEY\" > /tmp/oc-certs/app.key && \
            printf '%s' \"\$CERTIFICATE\" > /tmp/oc-certs/app.crt && \
            chmod 600 /tmp/oc-certs/app.key && \
            cd /var/www/owncloud && \
            php occ integrity:sign-app \
              --privateKey=/tmp/oc-certs/app.key \
              --certificate=/tmp/oc-certs/app.crt \
              --path=/app-staging/duo && \
            tar -czf /tmp/duo.tar.gz -C /app-staging duo
          "

          docker cp oc-signer:/app-staging/duo/appinfo/signature.json \
            "$GITHUB_WORKSPACE/appinfo/signature.json"
          docker cp oc-signer:/tmp/duo.tar.gz \
            "$GITHUB_WORKSPACE/duo.tar.gz"
          
          docker exec oc-signer md5sum /app-staging/duo/appinfo/signature.json
          docker exec oc-signer md5sum /tmp/duo.tar.gz
          md5sum "$GITHUB_WORKSPACE/appinfo/signature.json"
          md5sum "$GITHUB_WORKSPACE/duo.tar.gz"
          # Extract and check signature inside tarball
          tar -xOf "$GITHUB_WORKSPACE/duo.tar.gz" duo/appinfo/signature.json | md5sum

          docker rm -f oc-signer

      - name: Commit and push signature
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add appinfo/signature.json
          git diff --cached --quiet || \
            git commit -m "chore: update app signature [skip ci]"
          git push

      - name: Debug post-sign
        run: |
          echo "STAGING=$STAGING"
          echo "STAGING_PARENT=$(dirname $STAGING)"
          ls -la "$(dirname $STAGING)"
          echo "---"
          ls -la "$GITHUB_WORKSPACE/appinfo/signature.json" || echo "signature.json NOT in workspace"
          ls -la "$STAGING/appinfo/signature.json" || echo "signature.json NOT in staging"
      
      - name: Package app tarball
        run: |
          tar -czf "$GITHUB_WORKSPACE/duo.tar.gz" \
            -C "$(dirname $STAGING)" \
            --transform 's/^staging/duo/' \
            staging
      
      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v3
        with:
          name: duo
          path: ${{ github.workspace }}/duo.tar.gz

      - name: Clean up
        if: always()
        run: rm -rf /tmp/oc-certs /tmp/app-staging