name: Sign app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  OC_VERSION: "10.16.1"

jobs:
  sign:
    runs-on: ubuntu-latest  # plain runner, no container:

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy app to staging dir and strip .git
        run: |
          STAGING=$(realpath "$GITHUB_WORKSPACE/../staging")
          cp -r "$GITHUB_WORKSPACE/." "$STAGING"
          rm -rf "$STAGING/.git"
          rm -rf "$STAGING/.gitea"
          echo "STAGING=$STAGING" >> $GITHUB_ENV
      
      - name: Debug staging
        run: |
          echo "STAGING=$STAGING"
          ls -la "$STAGING"
          ls -la "$STAGING/appinfo"
          docker run --rm \
            -v "$STAGING":/app-staging \
            owncloud/server:10.15.3 \
            ls -la /app-staging

      - name: Sign the app
        run: |
          # Start container in background
          docker run -d --name oc-signer \
            -e PRIVATE_KEY="${{ secrets.OC_PRIVATE_KEY }}" \
            -e CERTIFICATE="${{ secrets.OC_CERTIFICATE }}" \
            --entrypoint sleep \
            owncloud/server:$OC_VERSION 300

          # Copy staging dir into container
          docker cp "$STAGING/." oc-signer:/app-staging

          # Run signing
          docker exec oc-signer /bin/bash -c "
            mkdir -p /tmp/oc-certs && \
            printf '%s' \"\$PRIVATE_KEY\" > /tmp/oc-certs/app.key && \
            printf '%s' \"\$CERTIFICATE\" > /tmp/oc-certs/app.crt && \
            chmod 600 /tmp/oc-certs/app.key && \
            cd /var/www/owncloud && \
            php occ integrity:sign-app \
              --privateKey=/tmp/oc-certs/app.key \
              --certificate=/tmp/oc-certs/app.crt \
              --path=/app-staging
          "

          # Copy signature back out
          docker cp oc-signer:/app-staging/appinfo/signature.json \
            "$GITHUB_WORKSPACE/appinfo/signature.json"

          # Cleanup
          docker rm -f oc-signer

      - name: Copy signature back to workspace
        run: |
          cp "$GITHUB_WORKSPACE/../staging/appinfo/signature.json" \
             "$GITHUB_WORKSPACE/appinfo/signature.json"

      - name: Commit and push signature
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.local"
          git add appinfo/signature.json
          git diff --cached --quiet || \
            git commit -m "chore: update app signature [skip ci]"
          git push
      
      - name: Package app tarball
        run: |
          APP_NAME=$(basename "$GITHUB_REPOSITORY")
          mkdir -p /tmp/pkg/"$APP_NAME"
          cp -r /tmp/app-staging/. /tmp/pkg/"$APP_NAME"/
          tar -czf "$GITHUB_WORKSPACE/${APP_NAME}.tar.gz" \
            -C /tmp/pkg "$APP_NAME"
      
      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: ${{ github.event.repository.name }}.tar.gz

      - name: Clean up
        if: always()
        run: rm -rf /tmp/oc-certs /tmp/app-staging